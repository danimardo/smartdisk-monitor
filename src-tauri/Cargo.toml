[package]
name = "smartdisk-monitor"
version = "0.1.1"
description = "Supervisión local de discos para Windows"
authors = ["Daniel Diez Mardomingo"]
license = "MIT"
edition = "2021"
# `tauri-plugin-notification` 2.0.0 declara 1.77.2 como mínimo (README del plugin); el proyecto
# alinea aquí su promesa de compatibilidad con esa dependencia real, no con un 1.77 redondeado.
rust-version = "1.77.2"

[lib]
# Tauri 2 usa una biblioteca + un binario fino: así el dominio se puede testear sin arrancar la app.
name = "smartdisk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "smartdisk-monitor"
path = "src/main.rs"
# Sin arnés de pruebas para el binario. `main.rs` es una línea que delega en la biblioteca y no
# tiene ni tendrá tests, pero Cargo compilaría igualmente un ejecutable de prueba que hereda el
# manifiesto de `requireAdministrator` (ADR-004) y que no puede arrancar sin elevación: falla con
# ERROR_SXS_CANT_GEN_ACTCTX. Todo lo testeable vive en la biblioteca, que sí se prueba.
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Instancia única (ADR-025). No solo bloquea el segundo proceso: avisa al primero para que
# restaure su ventana, que es lo que exige la especificación. Un mutex con nombre bloquearía,
# pero la segunda instancia moriría en silencio y el usuario creería que la app no arranca.
tauri-plugin-single-instance = "2.4"

# Notificación nativa (T053, `docs/open-questions.md` I.2/R1). Oficial del equipo de Tauri, mismo
# criterio que `tauri-plugin-single-instance`: en Windows usa toast de WinRT. Se invoca solo desde
# Rust (`NotificationExt`), nunca desde el webview, así que no exige permiso de capacidades.
tauri-plugin-notification = "2.0.0"

# Registro de actividad (constitución §XV, ADR-024). `tracing` en vez de `log` por los spans:
# permiten seguir una recopilación o un benchmark completo con su contexto, sin repetir el
# identificador en cada llamada.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time"] }
tracing-appender = "0.2"
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.10.9"
ts-rs = "10.1.0"

# Diálogo nativo de guardado para exportar informes y el ZIP de diagnóstico (T091, ADR-031):
# `destinationPath` lo elige el usuario con el selector de Windows, no un parámetro de ruta libre
# que abriría una segunda vía de acceso al sistema de ficheros (principio IX).
tauri-plugin-dialog = "2"

# ZIP del diagnóstico (T090, ADR-032). Crate de uso muy extendido y mantenido: escribir a mano un
# formato binario con implicaciones de seguridad (cabeceras, CRC32, directorio central) no es un
# ahorro razonable frente a la dependencia, a diferencia del LCG de T079 (mucho más simple).
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"

[features]
default = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
